<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TaskPulse — To Do App</title>
    <!-- Google Fonts & FontAwesome -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        :root {
            --bg-primary: #0f172a;
            --bg-card: rgba(30, 41, 59, 0.6);
            --bg-input: rgba(15, 23, 42, 0.6);
            --border-color: rgba(255, 255, 255, 0.08);
            --border-hover: rgba(255, 255, 255, 0.18);
            --text-primary: #f8fafc;
            --text-secondary: #94a3b8;
            --text-muted: #64748b;
            --primary: #6366f1;
            --accent-purple: #a855f7;
            --success: #10b981;
            --warning: #f59e0b;
            --danger: #ef4444;
            --glass-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.36);
            --radius-md: 14px;
            --radius-sm: 8px;
            --transition: 0.25s cubic-bezier(0.4, 0, 0.2, 1);
        }

        [data-theme="light"] {
            --bg-primary: #f1f5f9;
            --bg-card: rgba(255, 255, 255, 0.75);
            --bg-input: rgba(241, 245, 249, 0.9);
            --border-color: rgba(0, 0, 0, 0.08);
            --border-hover: rgba(0, 0, 0, 0.18);
            --text-primary: #0f172a;
            --text-secondary: #475569;
            --text-muted: #94a3b8;
            --glass-shadow: 0 8px 32px 0 rgba(31, 38, 135, 0.08);
        }

        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Plus Jakarta Sans', sans-serif; }
        body {
            background-color: var(--bg-primary);
            color: var(--text-primary);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            padding: 2rem 1rem;
            transition: background 0.3s, color 0.3s;
        }

        .glass-panel {
            background: var(--bg-card);
            backdrop-filter: blur(16px);
            border: 1px solid var(--border-color);
            border-radius: 20px;
            box-shadow: var(--glass-shadow);
        }

        .app-container { width: 100%; max-width: 1000px; display: flex; flex-direction: column; gap: 1.5rem; }
        
        /* Header */
        header { display: flex; justify-content: space-between; align-items: center; padding: 1.2rem 1.75rem; }
        .logo { display: flex; align-items: center; gap: 0.8rem; font-size: 1.4rem; font-weight: 800; }
        .logo-icon {
            width: 42px; height: 42px; background: linear-gradient(135deg, var(--primary), var(--accent-purple));
            border-radius: var(--radius-md); display: flex; align-items: center; justify-content: center; color: #fff;
        }
        .highlight { background: linear-gradient(135deg, var(--primary), var(--accent-purple)); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
        
        .icon-btn {
            background: rgba(255, 255, 255, 0.05); border: 1px solid var(--border-color); color: var(--text-primary);
            width: 40px; height: 40px; border-radius: var(--radius-md); cursor: pointer; display: flex; align-items: center; justify-content: center;
            transition: var(--transition);
        }
        .icon-btn:hover { background: var(--primary); color: #fff; border-color: var(--primary); }

        /* Main Content Grid */
        .main-content { display: grid; grid-template-columns: 280px 1fr; gap: 1.5rem; }
        @media (max-width: 800px) { .main-content { grid-template-columns: 1fr; } }

        .sidebar { display: flex; flex-direction: column; gap: 1.25rem; }
        .stats-card, .category-card { padding: 1.25rem; }
        .card-title { font-size: 0.95rem; font-weight: 700; margin-bottom: 1rem; display: flex; align-items: center; gap: 0.5rem; color: var(--text-primary); }

        /* Progress Circle & Stats */
        .progress-container { position: relative; display: flex; justify-content: center; align-items: center; margin-bottom: 1rem; }
        .progress-ring { transform: rotate(-90deg); }
        .progress-ring__circle { stroke-dasharray: 283; stroke-dashoffset: 283; transition: stroke-dashoffset 0.6s ease; }
        .progress-text { position: absolute; text-align: center; }
        .progress-text span { display: block; font-size: 1.3rem; font-weight: 800; }
        .progress-text label { font-size: 0.7rem; color: var(--text-secondary); text-transform: uppercase; }

        .stats-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 0.5rem; text-align: center; }
        .stat-box { background: var(--bg-input); padding: 0.6rem; border-radius: var(--radius-sm); border: 1px solid var(--border-color); }
        .stat-num { font-size: 1rem; font-weight: 700; display: block; }
        .stat-label { font-size: 0.65rem; color: var(--text-secondary); }

        /* Category Chips */
        .cat-list { display: flex; flex-direction: column; gap: 0.4rem; }
        .cat-chip {
            background: transparent; border: 1px solid var(--border-color); color: var(--text-secondary);
            padding: 0.6rem 0.85rem; border-radius: var(--radius-md); display: flex; align-items: center; gap: 0.6rem;
            font-size: 0.85rem; font-weight: 600; cursor: pointer; transition: var(--transition);
        }
        .cat-chip:hover, .cat-chip.active { background: rgba(99, 102, 241, 0.15); border-color: var(--primary); color: var(--text-primary); }

        /* Task Form */
        .task-input-card { padding: 1.25rem; }
        #add-task-form { display: flex; flex-direction: column; gap: 0.85rem; }
        .input-row {
            display: flex; align-items: center; background: var(--bg-input); border: 1px solid var(--border-color);
            border-radius: var(--radius-md); padding: 0.4rem 0.6rem 0.4rem 1rem;
        }
        .input-row input { flex: 1; background: transparent; border: none; outline: none; color: var(--text-primary); font-size: 0.95rem; }
        
        .btn-primary {
            background: linear-gradient(135deg, var(--primary), var(--accent-purple)); color: #fff; border: none;
            padding: 0.6rem 1.2rem; border-radius: var(--radius-md); font-weight: 600; cursor: pointer; transition: var(--transition);
        }
        .btn-primary:hover { opacity: 0.9; transform: translateY(-1px); }

        .details-row { display: flex; gap: 0.5rem; flex-wrap: wrap; }
        .select-box {
            background: var(--bg-input); border: 1px solid var(--border-color); border-radius: var(--radius-sm);
            padding: 0.4rem 0.6rem; font-size: 0.8rem; color: var(--text-secondary); display: flex; align-items: center; gap: 0.4rem;
        }
        .select-box select { background: transparent; border: none; outline: none; color: var(--text-primary); cursor: pointer; font-size: 0.8rem; }
        .select-box select option { background: var(--bg-primary); }

        /* Filters & List */
        .controls-bar { display: flex; justify-content: space-between; align-items: center; margin: 1rem 0; flex-wrap: wrap; gap: 0.75rem; }
        .search-box {
            display: flex; align-items: center; gap: 0.5rem; background: var(--bg-card); border: 1px solid var(--border-color);
            border-radius: var(--radius-md); padding: 0.4rem 0.8rem; width: 220px;
        }
        .search-box input { background: transparent; border: none; outline: none; color: var(--text-primary); font-size: 0.85rem; width: 100%; }

        .status-filters { display: flex; background: var(--bg-card); border: 1px solid var(--border-color); padding: 3px; border-radius: var(--radius-md); }
        .filter-btn {
            background: transparent; border: none; color: var(--text-secondary); padding: 0.35rem 0.85rem;
            border-radius: var(--radius-sm); font-size: 0.8rem; font-weight: 600; cursor: pointer; transition: var(--transition);
        }
        .filter-btn.active { background: var(--primary); color: #fff; }

        /* Task List Items */
        .task-list { list-style: none; display: flex; flex-direction: column; gap: 0.65rem; }
        .task-item {
            background: var(--bg-card); border: 1px solid var(--border-color); border-radius: var(--radius-md);
            padding: 0.85rem 1.1rem; display: flex; align-items: center; justify-content: space-between; gap: 0.8rem;
            transition: var(--transition);
        }
        .task-item:hover { border-color: var(--border-hover); transform: translateY(-1px); }
        .task-item.completed { opacity: 0.6; }
        .task-item.completed .task-title { text-decoration: line-through; color: var(--text-muted); }

        .task-left { display: flex; align-items: center; gap: 0.85rem; flex: 1; }
        .checkbox {
            width: 20px; height: 20px; border-radius: 5px; border: 2px solid var(--text-muted);
            display: flex; align-items: center; justify-content: center; cursor: pointer; transition: var(--transition);
        }
        .checkbox i { font-size: 0.7rem; color: #fff; opacity: 0; }
        .task-item.completed .checkbox { background: var(--success); border-color: var(--success); }
        .task-item.completed .checkbox i { opacity: 1; }

        .task-title { font-size: 0.9rem; font-weight: 600; }
        .task-meta { display: flex; gap: 0.4rem; margin-top: 0.2rem; align-items: center; }
        .badge { font-size: 0.65rem; padding: 0.1rem 0.45rem; border-radius: 10px; font-weight: 700; text-transform: uppercase; }
        .badge-cat { background: rgba(255, 255, 255, 0.08); color: var(--primary); }
        .badge-prio { border: 1px solid currentColor; }
        .badge-prio.low { color: #3b82f6; }
        .badge-prio.medium { color: var(--warning); }
        .badge-prio.high { color: var(--danger); }

        .task-actions { display: flex; gap: 0.3rem; }
        .action-icon {
            background: transparent; border: none; color: var(--text-secondary); width: 30px; height: 30px;
            border-radius: var(--radius-sm); cursor: pointer; display: flex; align-items: center; justify-content: center;
        }
        .action-icon:hover { background: rgba(255, 255, 255, 0.1); color: var(--text-primary); }
        .action-icon.delete:hover { background: rgba(239, 68, 68, 0.15); color: var(--danger); }

        .empty-state { text-align: center; padding: 2.5rem 1rem; color: var(--text-secondary); }
        .empty-state i { font-size: 2.5rem; margin-bottom: 0.5rem; color: var(--text-muted); }
        .hidden { display: none !important; }
    </style>
</head>
<body>

    <div class="app-container">
        <!-- Header -->
        <header class="glass-panel">
            <div class="logo">
                <div class="logo-icon"><i class="fa-solid fa-check"></i></div>
                <span>Task<span class="highlight">Pulse</span></span>
            </div>
            <button id="theme-toggle" class="icon-btn" title="Toggle Theme"><i class="fa-solid fa-moon"></i></button>
        </header>

        <!-- Main Content Grid -->
        <main class="main-content">
            <!-- Sidebar -->
            <aside class="sidebar">
                <!-- Stats Card -->
                <div class="glass-panel stats-card">
                    <div class="card-title"><i class="fa-solid fa-chart-pie" style="color: var(--primary);"></i> Productivity</div>
                    <div class="progress-container">
                        <svg class="progress-ring" width="100" height="100">
                            <circle stroke="rgba(255,255,255,0.1)" stroke-width="8" fill="transparent" r="40" cx="50" cy="50"/>
                            <circle id="progress-circle" class="progress-ring__circle" stroke="var(--primary)" stroke-width="8" stroke-linecap="round" fill="transparent" r="40" cx="50" cy="50"/>
                        </svg>
                        <div class="progress-text">
                            <span id="completion-percentage">0%</span>
                            <label>Done</label>
                        </div>
                    </div>
                    <div class="stats-grid">
                        <div class="stat-box"><span class="stat-num" id="total-count">0</span><span class="stat-label">Total</span></div>
                        <div class="stat-box"><span class="stat-num" style="color: var(--warning);" id="pending-count">0</span><span class="stat-label">Pending</span></div>
                        <div class="stat-box"><span class="stat-num" style="color: var(--success);" id="completed-count">0</span><span class="stat-label">Done</span></div>
                    </div>
                </div>

                <!-- Category Filters -->
                <div class="glass-panel category-card">
                    <div class="card-title"><i class="fa-solid fa-tags" style="color: var(--primary);"></i> Categories</div>
                    <div class="cat-list">
                        <button class="cat-chip active" data-category="all"><i class="fa-solid fa-layer-group"></i> All Tasks</button>
                        <button class="cat-chip" data-category="Work"><i class="fa-solid fa-briefcase"></i> Work</button>
                        <button class="cat-chip" data-category="Personal"><i class="fa-solid fa-user"></i> Personal</button>
                        <button class="cat-chip" data-category="Health"><i class="fa-solid fa-heart-pulse"></i> Health</button>
                        <button class="cat-chip" data-category="Finance"><i class="fa-solid fa-wallet"></i> Finance</button>
                    </div>
                </div>
            </aside>

            <!-- Tasks Area -->
            <section class="tasks-area">
                <!-- Add Task Form -->
                <div class="glass-panel task-input-card">
                    <form id="add-task-form">
                        <div class="input-row">
                            <input type="text" id="task-title" placeholder="Add a new task..." required autocomplete="off">
                            <button type="submit" class="btn-primary">Add Task</button>
                        </div>
                        <div class="details-row">
                            <div class="select-box">
                                <i class="fa-solid fa-folder"></i>
                                <select id="task-category">
                                    <option value="Personal">Personal</option>
                                    <option value="Work">Work</option>
                                    <option value="Health">Health</option>
                                    <option value="Finance">Finance</option>
                                </select>
                            </div>
                            <div class="select-box">
                                <i class="fa-solid fa-flag"></i>
                                <select id="task-priority">
                                    <option value="low">Low Priority</option>
                                    <option value="medium" selected>Medium Priority</option>
                                    <option value="high">High Priority</option>
                                </select>
                            </div>
                        </div>
                    </form>
                </div>

                <!-- Controls Bar -->
                <div class="controls-bar">
                    <div class="search-box">
                        <i class="fa-solid fa-magnifying-glass" style="color: var(--text-muted);"></i>
                        <input type="text" id="search-input" placeholder="Search tasks...">
                    </div>
                    <div class="status-filters">
                        <button class="filter-btn active" data-status="all">All</button>
                        <button class="filter-btn" data-status="active">Active</button>
                        <button class="filter-btn" data-status="completed">Completed</button>
                    </div>
                </div>

                <!-- Task List -->
                <ul id="task-list" class="task-list"></ul>
                <div id="empty-state" class="empty-state hidden">
                    <i class="fa-solid fa-clipboard-check"></i>
                    <h3>No tasks found</h3>
                    <p>Add a new task above to get started!</p>
                </div>
            </section>
        </main>
    </div>

    <!-- JavaScript Application Logic -->
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            let tasks = JSON.parse(localStorage.getItem('tp_tasks')) || [
                { id: '1', title: 'Complete Web Project Draft', category: 'Work', priority: 'high', completed: false },
                { id: '2', title: '30-minute cardio session', category: 'Health', priority: 'medium', completed: true },
                { id: '3', title: 'Review monthly expenses', category: 'Finance', priority: 'low', completed: false }
            ];
            let currentStatus = 'all';
            let currentCategory = 'all';
            let searchQuery = '';
            let theme = localStorage.getItem('tp_theme') || 'dark';

            const themeToggleBtn = document.getElementById('theme-toggle');
            const addTaskForm = document.getElementById('add-task-form');
            const taskTitleInput = document.getElementById('task-title');
            const taskCategoryInput = document.getElementById('task-category');
            const taskPriorityInput = document.getElementById('task-priority');
            const searchInput = document.getElementById('search-input');
            const taskList = document.getElementById('task-list');
            const emptyState = document.getElementById('empty-state');

            // Theme Toggle
            setTheme(theme);
            themeToggleBtn.addEventListener('click', () => {
                theme = theme === 'dark' ? 'light' : 'dark';
                setTheme(theme);
            });

            function setTheme(t) {
                document.documentElement.setAttribute('data-theme', t);
                localStorage.setItem('tp_theme', t);
                themeToggleBtn.querySelector('i').className = t === 'dark' ? 'fa-solid fa-moon' : 'fa-solid fa-sun';
            }

            // Add Task
            addTaskForm.addEventListener('submit', (e) => {
                e.preventDefault();
                const title = taskTitleInput.value.trim();
                if (!title) return;

                tasks.unshift({
                    id: Date.now().toString(),
                    title,
                    category: taskCategoryInput.value,
                    priority: taskPriorityInput.value,
                    completed: false
                });

                saveAndRender();
                taskTitleInput.value = '';
            });

            // Search & Filters
            searchInput.addEventListener('input', (e) => {
                searchQuery = e.target.value.toLowerCase().trim();
                render();
            });

            document.querySelectorAll('.filter-btn').forEach(btn => {
                btn.addEventListener('click', () => {
                    document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
                    btn.classList.add('active');
                    currentStatus = btn.dataset.status;
                    render();
                });
            });

            document.querySelectorAll('.cat-chip').forEach(btn => {
                btn.addEventListener('click', () => {
                    document.querySelectorAll('.cat-chip').forEach(b => b.classList.remove('active'));
                    btn.classList.add('active');
                    currentCategory = btn.dataset.category;
                    render();
                });
            });

            function saveAndRender() {
                localStorage.setItem('tp_tasks', JSON.stringify(tasks));
                render();
            }

            function render() {
                const filtered = tasks.filter(t => {
                    const statusMatch = currentStatus === 'all' || (currentStatus === 'active' && !t.completed) || (currentStatus === 'completed' && t.completed);
                    const catMatch = currentCategory === 'all' || t.category === currentCategory;
                    const searchMatch = t.title.toLowerCase().includes(searchQuery);
                    return statusMatch && catMatch && searchMatch;
                });

                taskList.innerHTML = '';
                if (filtered.length === 0) {
                    emptyState.classList.remove('hidden');
                } else {
                    emptyState.classList.add('hidden');
                    filtered.forEach(t => {
                        const li = document.createElement('li');
                        li.className = `task-item ${t.completed ? 'completed' : ''}`;
                        li.innerHTML = `
                            <div class="task-left">
                                <div class="checkbox"><i class="fa-solid fa-check"></i></div>
                                <div>
                                    <div class="task-title">${escapeHtml(t.title)}</div>
                                    <div class="task-meta">
                                        <span class="badge badge-cat">${t.category}</span>
                                        <span class="badge badge-prio ${t.priority}">${t.priority}</span>
                                    </div>
                                </div>
                            </div>
                            <div class="task-actions">
                                <button class="action-icon delete"><i class="fa-solid fa-trash"></i></button>
                            </div>
                        `;
                        li.querySelector('.checkbox').addEventListener('click', () => {
                            t.completed = !t.completed;
                            saveAndRender();
                        });
                        li.querySelector('.action-icon.delete').addEventListener('click', () => {
                            tasks = tasks.filter(item => item.id !== t.id);
                            saveAndRender();
                        });
                        taskList.appendChild(li);
                    });
                }

                // Update Stats
                const total = tasks.length;
                const completed = tasks.filter(t => t.completed).length;
                const pending = total - completed;
                const percent = total === 0 ? 0 : Math.round((completed / total) * 100);

                document.getElementById('total-count').textContent = total;
                document.getElementById('pending-count').textContent = pending;
                document.getElementById('completed-count').textContent = completed;
                document.getElementById('completion-percentage').textContent = `${percent}%`;

                // SVG ring update (circumference = 251.3)
                const offset = 251.3 - (percent / 100) * 251.3;
                document.getElementById('progress-circle').style.strokeDashoffset = offset;
            }

            function escapeHtml(text) {
                const div = document.createElement('div');
                div.textContent = text;
                return div.innerHTML;
            }

            render();
        });
    </script>
</body>
</html>
